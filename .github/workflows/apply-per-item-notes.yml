name: Apply per-item notes patch
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip per-item-notes]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-per-item-notes.cjs
      - name: Commit changes and remove patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-per-item-notes.cjs .github/workflows/apply-per-item-notes.yml
          git add -A
          git commit -m "fix: per-item notes and oven display [skip per-item-notes]"
          git push origin HEAD:main
